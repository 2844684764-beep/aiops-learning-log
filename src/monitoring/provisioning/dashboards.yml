apiVersion: 1

# 告诉 Grafana：去 /var/lib/grafana/dashboards 目录读 JSON 文件，自动加载成仪表盘
providers:
  - name: aiops
    orgId: 1
    folder: AIOps
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30     # 每 30 秒检查文件有没有变化
    allowUiUpdates: true          # 允许在界面上临时改（改了不会写回文件）
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

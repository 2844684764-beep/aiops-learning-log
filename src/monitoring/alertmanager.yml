route:
  receiver: my-webhook
  group_by: [alertname]        # 同一类告警合并
  group_wait: 10s              # 等 10 秒看有没有同类，一起发
  group_interval: 30s
  repeat_interval: 1h          # 没恢复的话，1 小时再提醒一次

receivers:
  - name: my-webhook
    webhook_configs:
      - url: "http://host.docker.internal:8001/alert"
        send_resolved: true    # 恢复了也通知一声
